name: Bug report
description: Report a reproducible issue with E-Bike Companion.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Please do not include GPS routes, exact locations, passwords, tokens, serial numbers, or unredacted diagnostics. This issue is public.
  - type: input
    id: app_version
    attributes:
      label: App version and build
      description: For example, the version shown in the app or release page.
      placeholder: "0.5.4 (19)"
    validations:
      required: true
  - type: input
    id: android_version
    attributes:
      label: Android version and device model
      placeholder: "Android version; phone/tablet model"
    validations:
      required: true
  - type: input
    id: bike_setup
    attributes:
      label: Bike / display / controller (if relevant)
      description: Only share details you are comfortable making public. Do not include serial numbers.
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      render: text
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      render: text
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Do not test while riding or perform safety-critical experiments.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: safe_diagnostics
    attributes:
      label: Sanitised error text (optional)
      description: Paste only the minimum relevant text after reviewing it for personal data, tokens, device identifiers and exact location. Do not attach raw exports.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and safety check
      options:
        - label: I checked this report and removed GPS/location data, credentials, serial numbers and personal information.
          required: true
        - label: I understand this issue is public.
          required: true
